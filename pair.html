<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CYBER PAIR // WHATSAPP CORE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    :root {
      --neon-cyan: #00f3ff;
      --neon-pink: #ff0055;
      --neon-purple: #9d00ff;
      --cyber-bg: #070913;
      --cyber-panel: rgba(14, 18, 36, 0.75);
      --terminal-border: rgba(0, 243, 255, 0.35);
      --text-main: #e2f7ff;
      --text-dim: #7085a6;
      --glow-cyan: 0 0 15px rgba(0, 243, 255, 0.6);
      --glow-pink: 0 0 15px rgba(ff, 0, 85, 0.6);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Rajdhani', sans-serif;
      background-color: var(--cyber-bg);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(157, 0, 255, 0.18) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(0, 243, 255, 0.18) 0%, transparent 40%),
        linear-gradient(rgba(0, 243, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 243, 255, 0.04) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    /* Cyber Panel Container */
    .container {
      width: 100%;
      max-width: 460px;
      background: var(--cyber-panel);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 14px;
      padding: 30px 24px;
      border: 1px solid var(--terminal-border);
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.15), inset 0 0 15px rgba(0, 243, 255, 0.05);
      position: relative;
    }

    /* Cyber Corner Accents */
    .container::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      width: 25px;
      height: 25px;
      border-top: 3px solid var(--neon-cyan);
      border-left: 3px solid var(--neon-cyan);
    }
    .container::after {
      content: '';
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 25px;
      height: 25px;
      border-bottom: 3px solid var(--neon-pink);
      border-right: 3px solid var(--neon-pink);
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 15px;
      background: radial-gradient(circle, rgba(0, 243, 255, 0.2) 0%, rgba(7, 9, 19, 0.9) 70%);
      border: 2px solid var(--neon-cyan);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      color: var(--neon-cyan);
      box-shadow: var(--glow-cyan);
      animation: pulse 3s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 15px rgba(0, 243, 255, 0.5); }
      50% { box-shadow: 0 0 25px rgba(0, 243, 255, 0.8), 0 0 10px var(--neon-pink); }
    }

    .title {
      font-family: 'Orbitron', sans-serif;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #fff;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(0, 243, 255, 0.7);
      margin-bottom: 5px;
    }

    .subtitle {
      font-size: 13px;
      letter-spacing: 1.5px;
      color: var(--neon-cyan);
      text-transform: uppercase;
      opacity: 0.8;
      font-weight: 600;
    }

    /* Mode Selector Switch */
    .toggle-container {
      display: flex;
      background: rgba(4, 7, 18, 0.8);
      border: 1px solid var(--terminal-border);
      border-radius: 8px;
      padding: 4px;
      margin-bottom: 22px;
      gap: 6px;
    }

    .toggle-option {
      flex: 1;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      border-radius: 6px;
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      letter-spacing: 1px;
      font-weight: 700;
      color: var(--text-dim);
      transition: all 0.3s ease;
      text-transform: uppercase;
    }

    .toggle-option.active {
      background: linear-gradient(135deg, rgba(0, 243, 255, 0.25), rgba(157, 0, 255, 0.25));
      color: var(--neon-cyan);
      border: 1px solid var(--neon-cyan);
      box-shadow: inset 0 0 10px rgba(0, 243, 255, 0.4);
    }

    .input-group {
      margin-bottom: 18px;
    }

    .input-group.hidden {
      display: none;
    }

    .input-label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-dim);
      font-weight: 600;
    }

    .input-field {
      width: 100%;
      padding: 14px 16px;
      background: rgba(3, 6, 17, 0.8);
      border: 1.5px solid var(--terminal-border);
      border-radius: 8px;
      color: var(--neon-cyan);
      font-family: 'Rajdhani', monospace;
      font-size: 17px;
      letter-spacing: 1.5px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .input-field:focus {
      outline: none;
      border-color: var(--neon-cyan);
      box-shadow: var(--glow-cyan);
    }

    /* Cyber Action Button */
    .generate-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(90deg, #00f3ff, #0088ff);
      border: none;
      border-radius: 8px;
      color: #030816;
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 16px;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .generate-btn:hover {
      background: linear-gradient(90deg, #00e1ff, #9d00ff);
      color: #fff;
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.7);
      transform: translateY(-2px);
    }

    .generate-btn.hidden {
      display: none;
    }

    /* Code Terminal Display */
    .code-display {
      background: rgba(2, 5, 15, 0.9);
      padding: 16px;
      border-radius: 8px;
      text-align: center;
      font-family: 'Orbitron', monospace;
      font-size: 15px;
      letter-spacing: 2px;
      font-weight: 700;
      color: var(--text-dim);
      margin-bottom: 16px;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px dashed var(--terminal-border);
    }

    .code-display.ready {
      color: var(--neon-cyan);
      border: 1px solid var(--neon-cyan);
      box-shadow: inset 0 0 15px rgba(0, 243, 255, 0.25);
      font-size: 20px;
    }

    .qr-display {
      background: rgba(2, 5, 15, 0.9);
      padding: 24px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 16px;
      border: 1px solid var(--terminal-border);
      display: none;
    }

    .qr-image {
      max-width: 220px;
      max-height: 220px;
      margin: 0 auto 15px;
      border-radius: 6px;
      border: 2px solid var(--neon-cyan);
      box-shadow: var(--glow-cyan);
      background: #fff;
      padding: 6px;
    }

    .qr-instructions {
      font-size: 13px;
      letter-spacing: 1px;
      color: var(--text-dim);
    }

    .copy-btn {
      width: 100%;
      padding: 12px;
      background: rgba(0, 243, 255, 0.08);
      border: 1px solid var(--terminal-border);
      border-radius: 8px;
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--neon-cyan);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.3s ease;
    }

    .copy-btn:hover {
      background: var(--neon-cyan);
      color: #030816;
      box-shadow: var(--glow-cyan);
    }

    .success-message {
      color: var(--neon-cyan);
      text-shadow: 0 0 10px rgba(0, 243, 255, 0.8);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .error-message {
      color: var(--neon-pink);
      text-shadow: 0 0 10px rgba(255, 0, 85, 0.8);
      font-size: 13px;
      letter-spacing: 1px;
    }

    .loading {
      display: none;
      text-align: center;
      margin: 16px 0;
    }

    .loading i {
      font-size: 26px;
      color: var(--neon-cyan);
      animation: spin 0.8s linear infinite;
      text-shadow: var(--glow-cyan);
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .footer {
      text-align: center;
      margin-top: 24px;
      font-family: 'Orbitron', monospace;
      font-size: 10px;
      letter-spacing: 1.5px;
      color: var(--text-dim);
      opacity: 0.6;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo"><i class="fas fa-microchip"></i></div>
      <h1 class="title">CYBER PAIR</h1>
      <p class="subtitle">// WA NODE LINKER SYSTEM //</p>
    </div>

    <!-- Toggle Selector -->
    <div class="toggle-container">
      <div class="toggle-option active" data-mode="pair">
        <i class="fas fa-terminal"></i> PAIR CODE
      </div>
      <div class="toggle-option" data-mode="qr">
        <i class="fas fa-qrcode"></i> QR MATRIX
      </div>
    </div>

    <!-- Input Box -->
    <div class="input-group" id="inputGroup">
      <label class="input-label"><i class="fas fa-phone-alt"></i> TARGET NUMBER WITH COUNTRY CODE</label>
      <input type="text" id="mobileNumber" class="input-field" placeholder="947xxxxxxxx" autocomplete="off">
    </div>

    <button class="generate-btn" id="submit">
      <i class="fas fa-bolt"></i> INITIALIZE PAIRING
    </button>

    <div class="loading" id="loading">
      <i class="fas fa-circle-notch"></i>
    </div>

    <div class="code-display" id="codeDisplay">
      SYSTEM READY // AWAITING INPUT
    </div>

    <div class="qr-display" id="qrDisplay">
      <img id="qrImage" class="qr-image" src="" alt="QR Code Matrix">
      <div class="qr-instructions" id="qrInstructions">
        SCAN MATRIX USING LINKED DEVICES IN WHATSAPP
      </div>
    </div>

    <button class="copy-btn" id="copy" onclick="copyCode()">
      <i class="fas fa-clone"></i> COPY PAIR CODE
    </button>

    <div class="footer">
      <p>[ STATUS: SECURED // ENCRYPTED BAIL INTERFACE ]</p>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.0.0-alpha.1/axios.min.js"></script>
  <script>
    let currentMode = 'pair';

    document.querySelectorAll('.toggle-option').forEach(option => {
      option.addEventListener('click', function() {
        const mode = this.dataset.mode;
        if (mode === currentMode) return;

        document.querySelectorAll('.toggle-option').forEach(opt => opt.classList.remove('active'));
        this.classList.add('active');
        currentMode = mode;

        const submitBtn = document.getElementById('submit');
        const inputGroup = document.getElementById('inputGroup');
        const codeDisplay = document.getElementById('codeDisplay');
        const qrDisplay = document.getElementById('qrDisplay');
        
        if (mode === 'pair') {
          submitBtn.classList.remove('hidden');
          inputGroup.classList.remove('hidden');
          qrDisplay.style.display = 'none';
          codeDisplay.style.display = 'flex';
          codeDisplay.className = 'code-display';
          codeDisplay.innerHTML = 'SYSTEM READY // AWAITING INPUT';
        } else {
          submitBtn.classList.add('hidden');
          inputGroup.classList.add('hidden');
          generateQRCode();
        }
      });
    });

    async function generateQRCode() {
      const codeDisplay = document.getElementById("codeDisplay");
      const qrDisplay = document.getElementById("qrDisplay");
      const loadingSpinner = document.getElementById("loading");

      loadingSpinner.style.display = "block";
      codeDisplay.style.display = 'none';
      qrDisplay.style.display = 'none';

      try {
        const response = await axios('/qr');
        if (response.data.qr) {
          document.getElementById('qrImage').src = response.data.qr;
          qrDisplay.style.display = 'block';
        } else {
          codeDisplay.className = 'code-display';
          codeDisplay.innerHTML = '<span class="error-message"><i class="fas fa-triangle-exclamation"></i> FAILED TO LOAD QR MATRIX</span>';
          codeDisplay.style.display = 'flex';
        }
      } catch (error) {
        codeDisplay.className = 'code-display';
        codeDisplay.innerHTML = '<span class="error-message"><i class="fas fa-triangle-exclamation"></i> TIMEOUT ERROR // TRY AGAIN</span>';
        codeDisplay.style.display = 'flex';
      } finally {
        loadingSpinner.style.display = "none";
      }
    }

    document.getElementById("submit").addEventListener("click", async (e) => {
      e.preventDefault();
      
      const mobileNumberInput = document.getElementById("mobileNumber");
      const codeDisplay = document.getElementById("codeDisplay");
      const loadingSpinner = document.getElementById("loading");

      const mobileNumber = mobileNumberInput.value.trim();
      if (!mobileNumber) {
        codeDisplay.className = 'code-display';
        codeDisplay.innerHTML = '<span class="error-message"><i class="fas fa-exclamation-triangle"></i> ENTER VALID PHONE NUMBER</span>';
        return;
      }

      loadingSpinner.style.display = "block";
      codeDisplay.className = 'code-display';
      codeDisplay.innerHTML = 'ESTABLISHING SECURE HANDSHAKE...';

      try {
        const cleanNumber = mobileNumber.replace(/[^0-9]/g, "");
        const response = await axios(`/pair?number=${cleanNumber}`);
        const code = response.data.code;

        if (code && code !== "Service Unavailable") {
          codeDisplay.className = 'code-display ready';
          codeDisplay.innerHTML = `<span class="success-message"><i class="fas fa-key"></i> ${code}</span>`;
        } else {
          codeDisplay.className = 'code-display';
          codeDisplay.innerHTML = '<span class="error-message"><i class="fas fa-triangle-exclamation"></i> GATEWAY UNAVAILABLE</span>';
        }
      } catch (error) {
        codeDisplay.className = 'code-display';
        codeDisplay.innerHTML = '<span class="error-message"><i class="fas fa-triangle-exclamation"></i> SYSTEM CONNECTION FAILED</span>';
      } finally {
        loadingSpinner.style.display = "none";
      }
    });

    function copyCode() {
      const codeDisplay = document.getElementById("codeDisplay");
      const text = codeDisplay.innerText.trim();
      if (!text || text.includes('SYSTEM') || text.includes('ENTER') || text.includes('FAILED')) return;

      navigator.clipboard.writeText(text).then(() => {
        const copyBtn = document.getElementById("copy");
        const original = copyBtn.innerHTML;
        copyBtn.innerHTML = '<i class="fas fa-check"></i> COPIED TO CLIPBOARD';
        copyBtn.style.borderColor = 'var(--neon-cyan)';
        setTimeout(() => {
          copyBtn.innerHTML = original;
          copyBtn.style.borderColor = '';
        }, 2000);
      });
    }
  </script>
</body>
</html>
